name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.0.0
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build
      run: pnpm run build:root-github-pages
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: homepage-ui-dist
        path: ./dist/homepage-ui

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: homepage-ui-dist
          path: ./dist

      - name: Checkout camdziurgot.github.io
        uses: actions/checkout@v4
        with:
          repository: camdziurgot/camdziurgot.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-repo

      - name: Deploy to camdziurgot.github.io
        run: |
          cd pages-repo
          git rm -rf --ignore-unmatch . --quiet || true
          cp -r ../dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy homepage-ui to camdziurgot.github.io"
          git push
